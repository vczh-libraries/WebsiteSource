<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gaclib: a C++ user interface library with declarative layouts, data binding, and renderers for desktop, terminal, and the web.">
    <title>Gaclib — C++ interfaces, from desktop to terminal</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/homeres/index.css">
    <script type="module" src="/homeres/index.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <a class="brand" href="/index.html" aria-label="Gaclib home"><img id="brand-logo" width="160" height="64" alt="Gaclib"></a>
        <nav id="navigation" aria-label="Main navigation"></nav>
        <fieldset class="appearance"><legend class="sr-only">Page appearance</legend>
            <label><input type="radio" name="appearance" id="style-gui" value="gui" checked><span>GUI</span></label>
            <label><input type="radio" name="appearance" id="style-tui" value="tui"><span>TUI</span></label>
        </fieldset>
    </header>
    <main id="main">
        <p id="load-status" role="status">Loading Gaclib…</p>
        <noscript><p>This introduction needs JavaScript to load its content. Read the <a href="/doc/current/home.html">Gaclib documentation</a> or <a href="https://github.com/vczh-libraries/Release">browse the source</a>.</p></noscript>
        <div id="home-content" hidden>
            <section class="hero" aria-labelledby="hero-title">
                <div>
                    <p class="eyebrow" id="hero-eyebrow"></p>
                    <h1 id="hero-title"></h1>
                    <p class="intro" id="hero-description"></p>
                    <div class="hero-actions" id="hero-actions"></div>
                </div>
                <aside class="hero-note" aria-labelledby="hero-note-title">
                    <div class="window-bar"><span class="window-dot"></span><span id="hero-note-title"></span><span aria-hidden="true">─ □ ×</span></div>
                    <div class="hero-note-content"><p id="hero-note-heading"></p><ul id="hero-facts"></ul><a href="#platforms" id="hero-platform-link"></a></div>
                </aside>
            </section>

            <section id="examples" class="section" aria-labelledby="examples-title">
                <div class="section-heading"><div><p class="eyebrow" id="examples-eyebrow"></p><h2 id="examples-title"></h2></div><p id="examples-description"></p></div>
                <div class="workbench">
                    <div class="tab-list example-tabs" role="tablist" aria-label="Code examples">
                        <button type="button" id="tab-hello" role="tab" aria-selected="true" aria-controls="example-hello" data-tab="hello">01 <span>Hello world</span></button>
                        <button type="button" id="tab-binding" role="tab" aria-selected="false" aria-controls="example-binding" tabindex="-1" data-tab="binding">02 <span>Data binding</span></button>
                    </div>
                    <div id="example-hello" role="tabpanel" aria-labelledby="tab-hello"></div>
                    <div id="example-binding" role="tabpanel" aria-labelledby="tab-binding" hidden></div>
                </div>
                <p class="section-note" id="examples-note"></p>
            </section>

            <section id="platforms" class="section" aria-labelledby="platforms-title">
                <div class="section-heading"><div><p class="eyebrow" id="platforms-eyebrow"></p><h2 id="platforms-title"></h2></div><p id="platforms-description"></p></div>
                <div class="platform-workbench">
                    <div class="tab-list platform-tabs" role="tablist" aria-label="Platforms">
                        <button type="button" role="tab" id="tab-windows" data-tab="windows" aria-selected="true" aria-controls="platform-windows"><span class="platform-icon" aria-hidden="true">⊞</span><span>Windows<small>DirectX · GDI · TUI</small></span></button>
                        <button type="button" role="tab" id="tab-linux" data-tab="linux" aria-selected="false" aria-controls="platform-linux" tabindex="-1"><span class="platform-icon" aria-hidden="true">&gt;_</span><span>Linux<small>Wayland · TUI</small></span></button>
                        <button type="button" role="tab" id="tab-macos" data-tab="macos" aria-selected="false" aria-controls="platform-macos" tabindex="-1"><span class="platform-icon" aria-hidden="true">⌘</span><span>macOS<small>Cocoa · TUI</small></span></button>
                        <button type="button" role="tab" id="tab-html5" data-tab="html5" aria-selected="false" aria-controls="platform-html5" tabindex="-1"><span class="platform-icon" aria-hidden="true">&lt;/&gt;</span><span>Web<small>HTML5</small></span></button>
                    </div>
                    <div id="platform-windows" role="tabpanel" aria-labelledby="tab-windows"></div>
                    <div id="platform-linux" role="tabpanel" aria-labelledby="tab-linux" hidden></div>
                    <div id="platform-macos" role="tabpanel" aria-labelledby="tab-macos" hidden></div>
                    <div id="platform-html5" role="tabpanel" aria-labelledby="tab-html5" hidden></div>
                </div>
            </section>

            <section class="section" id="start" aria-labelledby="start-title">
                <div class="section-heading"><div><p class="eyebrow" id="start-eyebrow"></p><h2 id="start-title"></h2></div><p id="start-description"></p></div>
                <div class="quick-links" id="quick-links"></div>
            </section>

            <section class="section" id="features" aria-labelledby="features-title">
                <div class="section-heading"><div><p class="eyebrow" id="features-eyebrow"></p><h2 id="features-title"></h2></div><p id="features-description"></p></div>
                <div class="feature-grid" id="feature-grid"></div>
            </section>
            <footer><p id="footer-text"></p><div id="footer-links"></div><a href="#main" id="back-to-top"></a></footer>
        </div>
    </main>

    <template id="example-template">
        <div class="example-grid">
            <div class="source-pane"><div class="pane-label"><span data-field="sourceLabel"></span><span class="language">GacUI XML</span></div><pre tabindex="0"><code></code></pre><a class="source-link" data-field="docs"></a></div>
            <div class="preview-pane"><div class="pane-label"><span data-field="resultLabel"></span><span class="live-indicator" data-field="liveLabel"></span></div><div class="preview-stage"></div><p class="preview-caption" data-field="caption"></p></div>
        </div>
    </template>
    <template id="hello-template">
        <div class="demo-window"><div class="window-bar"><span data-field="windowTitle"></span><span aria-hidden="true">×</span></div><div class="demo-body"><div><h3 data-field="heading"></h3><p data-field="message"></p></div></div><div class="demo-actions"><button type="button" class="primary" data-field="buttonLabel"></button></div></div>
        <div class="demo-closed" hidden><p data-field="closedMessage" role="status"></p><button type="button" data-field="reopenLabel"></button></div>
    </template>
    <template id="binding-template">
        <div class="demo-window"><div class="window-bar"><span data-field="windowTitle"></span><span aria-hidden="true">─ □ ×</span></div><div class="binding-body"><label for="demo-name" data-field="inputLabel"></label><input id="demo-name" type="text" autocomplete="off" maxlength="120"><div class="greeting"><span class="message-icon" aria-hidden="true">↳</span><output for="demo-name" aria-live="polite"></output></div></div><div class="binding-status" data-field="status"></div></div>
    </template>
    <template id="gallery-template">
        <div class="platform-info"><p></p><a></a></div>
        <div class="tab-list mode-tabs" role="tablist" aria-label="Renderer appearance">
            <button type="button" role="tab" data-tab="gui" aria-selected="true">GUI</button>
            <button type="button" role="tab" data-tab="tui" aria-selected="false" tabindex="-1">TUI</button>
        </div>
        <div class="gallery-body"></div>
    </template>
    <template id="gui-themes-template">
        <div class="tab-list theme-tabs" role="tablist" aria-label="GUI color theme" aria-orientation="vertical">
            <button type="button" role="tab" data-tab="default"><span class="swatch default"></span>Default</button>
            <button type="button" role="tab" data-tab="aurora"><span class="swatch aurora"></span>Aurora</button>
            <button type="button" role="tab" data-tab="ember"><span class="swatch ember"></span>Ember</button>
            <button type="button" role="tab" data-tab="lagoon"><span class="swatch lagoon"></span>Lagoon</button>
            <button type="button" role="tab" data-tab="moonstone"><span class="swatch moonstone"></span>Moonstone</button>
            <button type="button" role="tab" data-tab="rosewood"><span class="swatch rosewood"></span>Rosewood</button>
        </div>
    </template>
    <template id="tui-themes-template">
        <div class="tab-list theme-tabs" role="tablist" aria-label="TUI color theme" aria-orientation="vertical">
            <button type="button" role="tab" data-tab="skyblue"><span class="swatch skyblue"></span>Sky Blue</button>
            <button type="button" role="tab" data-tab="emerald"><span class="swatch emerald"></span>Emerald</button>
            <button type="button" role="tab" data-tab="grass"><span class="swatch grass"></span>Grass</button>
            <button type="button" role="tab" data-tab="orange"><span class="swatch orange"></span>Orange</button>
            <button type="button" role="tab" data-tab="pink"><span class="swatch pink"></span>Pink</button>
            <button type="button" role="tab" data-tab="purple"><span class="swatch purple"></span>Purple</button>
        </div>
    </template>
    <template id="html5-themes-template">
        <div class="tab-list theme-tabs" role="tablist" aria-label="HTML5 screenshots" aria-orientation="vertical">
            <button type="button" role="tab" data-tab="windows">Windows host</button>
            <button type="button" role="tab" data-tab="linux">Ubuntu host</button>
            <button type="button" role="tab" data-tab="macos">macOS host</button>
            <button type="button" role="tab" data-tab="snapshots">Snapshot viewer</button>
        </div>
    </template>
</body>
</html>
